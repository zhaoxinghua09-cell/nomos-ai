<svg width="640" height="720" viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0b0e1c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#6fb1ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd97a"/>
      <stop offset="100%" stop-color="#e8a83d"/>
    </linearGradient>
  </defs>

  <!-- 背景徽章 -->
  <rect x="16" y="16" width="608" height="608" rx="128" fill="url(#bgGrad)"/>
  <circle cx="320" cy="320" r="252" fill="none" stroke="#2a3155" stroke-width="4"/>
  <circle cx="320" cy="320" r="240" fill="none" stroke="#232a4d" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- 秩序之 N：左柱(金/法则) -->
  <line x1="216" y1="404" x2="216" y2="212" stroke="#f5c451" stroke-width="30" stroke-linecap="round"/>
  <!-- 秩序之 N：右柱(金/法则) -->
  <line x1="424" y1="404" x2="424" y2="212" stroke="#f5c451" stroke-width="30" stroke-linecap="round"/>
  <!-- 秩序之 N：斜梁(蓝/治理) -->
  <line x1="216" y1="404" x2="424" y2="212" stroke="#4f8cff" stroke-width="30" stroke-linecap="round"/>

  <!-- 三节点：A³ 三定律 / 身份码 -->
  <circle cx="216" cy="212" r="24" fill="#3ddc97"/>
  <circle cx="424" cy="212" r="24" fill="#3ddc97"/>
  <circle cx="216" cy="404" r="24" fill="#3ddc97"/>
  <!-- 节点内芯 -->
  <circle cx="216" cy="212" r="9" fill="#0b0e1c"/>
  <circle cx="424" cy="212" r="9" fill="#0b0e1c"/>
  <circle cx="216" cy="404" r="9" fill="#0b0e1c"/>

  <!-- 斜梁上的治理节点(护照点) -->
  <circle cx="320" cy="308" r="13" fill="#f5c451"/>
  <circle cx="320" cy="308" r="5" fill="#0b0e1c"/>

  <!-- 底部基准线(共生底座) -->
  <line x1="168" y1="452" x2="472" y2="452" stroke="#9aa3c0" stroke-width="6" stroke-linecap="round"/>

  <!-- 字标 -->
  <text x="320" y="576" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="14" fill="#e8eaf6">NOMOS</text>
  <text x="320" y="624" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="10" fill="#4f8cff">AI</text>
  <text x="320" y="676" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" font-size="22" letter-spacing="5" fill="#9aa3c0">HUMAN · AI GOVERNANCE</text>
</svg>
